<!DOCTYPE html>
<html>
    <head>
        <title>Rock Paper Scissors</title>
        <link rel="stylesheet" href="style.css" type="text/css"/>
        <meta name="viewport" content="width=device-width, initial-scale=1" />
    </head>
    <body>
        <div class="game_board">
            <h1 class="game_title">Rock Paper Scissors</h1>

            <div class="score_row">
                <div class="score_area player">
                    Player
                </div>

                <div class="score_area bot">
                    Bot
                </div>
            </div>

            <div class="choice_row">
                <div class="choice_area player">
                    <button data-value="0" data-confirmation="0" class="choice_item"><img src="svg_icons/rock.svg" alt="Rock" /></button>
                    <button data-value="1" data-confirmation="0" class="choice_item"><img src="svg_icons/paper.svg" alt="Paper" /></button>
                    <button data-value="2" data-confirmation="0" class="choice_item"><img src="svg_icons/scissors.svg" alt="Scissors" /></button>
                </div>

                <div class="choice_area bot">
                    <button data-value="0" class="choice_item"><img src="svg_icons/rock.svg" alt="Rock" /></button>
                    <button data-value="1" class="choice_item"><img src="svg_icons/paper.svg" alt="Paper" /></button>
                    <button data-value="2" class="choice_item"><img src="svg_icons/scissors.svg" alt="Scissors" /></button>
                </div>
            </div>

            <div id="info_label" class="info_row">
                <!--Your move is: _, bot move is: _.-->
            </div>

        </div>
        <script src="main.js"></script>
    </body>
</html>
